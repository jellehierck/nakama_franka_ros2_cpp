controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    # Required controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

    # Custom controllers
    nakama_local_joint_position_controller:
      type: nakama_franka_controllers/LocalJointPositionController

    nakama_local_joint_impedance_controller:
      type: nakama_franka_controllers/LocalJointImpedanceController

nakama_local_joint_impedance_controller:
  ros__parameters:
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5